<ion-content>
  <ion-buttons>
    <ion-back-button defaultHref="/"></ion-back-button>
  </ion-buttons>

  <div class="character-header">
    <img [src]="personaje?.image" alt="{{ personaje?.name }}">
    <h1>{{ personaje?.name }}</h1>
  </div>

  <div class="stats-tabs">
    <ion-segment [value]="segmentValue" (ionChange)="segmentChanged($event)">
      <ion-segment-button *ngFor="let option of segmentOptions" [value]="option.value">
        <ion-label>{{ option.label }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <div class="stats-grid" *ngIf="segmentValue.startsWith('stats')">
    <div class="stats-column">
      <div class="stat-item">
        <h3>Fuerza</h3>
        <div class="custom-progress-bar">
          <div *ngFor="let block of getBlocks(personaje.stats.fuerza, 10)"
               [class.filled]="block"
               class="progress-block"></div>
        </div>
      </div>
      <div class="stat-item">
        <h3>Destreza</h3>
        <div class="custom-progress-bar">
          <div *ngFor="let block of getBlocks(personaje.stats.destreza, 10)"
               [class.filled]="block"
               class="progress-block"></div>
        </div>
      </div>
      <div class="stat-item">
        <h3>Constitución</h3>
        <div class="custom-progress-bar">
          <div *ngFor="let block of getBlocks(personaje.stats.constitucion, 10)"
               [class.filled]="block"
               class="progress-block"></div>
        </div>
      </div>
    </div>

    <div class="stats-column">
      <div class="stat-item">
        <h3>Sabiduría</h3>
        <div class="custom-progress-bar">
          <div *ngFor="let block of getBlocks(personaje.stats.sabiduria, 10)"
               [class.filled]="block"
               class="progress-block"></div>
        </div>
      </div>
      <div class="stat-item">
        <h3>Inteligencia</h3>
        <div class="custom-progress-bar">
          <div *ngFor="let block of getBlocks(personaje.stats.inteligencia, 10)"
               [class.filled]="block"
               class="progress-block"></div>
        </div>
      </div>
      <div class="stat-item">
        <h3>Apariencia</h3>
        <div class="custom-progress-bar">
          <div *ngFor="let block of getBlocks(personaje.stats.apariencia, 10)"
               [class.filled]="block"
               class="progress-block"></div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="segmentValue === 'objetos'">
    <p>Contenido de Objetos</p>
  </div>
</ion-content>
